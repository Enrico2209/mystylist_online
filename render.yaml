# Deploy su Render: API Node + frontend statico. Servono solo GitHub e Render.
#
# Le foto stanno nel repo, ma nella versione web: prepara_web.py le riduce da
# 435 MB a 43 MB (WebP a 1200 px), che a schermo non si distinguono e stanno
# in un repository senza problemi. Gli originali restano in locale. Così non
# serve né un bucket né un terzo account.
#
# I valori con sync:false si inseriscono a mano nel pannello di Render, una
# volta sola: sono segreti, o dipendono da domini che Render assegna al primo
# deploy e che quindi non si possono scrivere qui.

services:
  - type: web
    name: mystylist-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/salute
    envVars:
      - key: DATABASE_URL          # stringa di connessione Neon
        sync: false
      - key: JWT_SECRET            # node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
        sync: false
      - key: OUTFITS_JSON          # il JSON viaggia col servizio
        value: ./dati/outfits_ui.json
      - key: MEDIA_BASE_URL        # <indirizzo del frontend qui sotto>/media
        sync: false
      - key: CORS_ORIGIN           # l'indirizzo del frontend qui sotto
        sync: false
      - key: NODE_VERSION
        value: "22"

  - type: web
    name: mystylist
    runtime: static
    rootDir: mystylist
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL          # l'indirizzo dell'API qui sopra
        sync: false
    routes:
      # La UI è una single-page app: senza questa regola un ricaricamento su
      # /dashboard chiederebbe a Render un file che non esiste e darebbe 404.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
